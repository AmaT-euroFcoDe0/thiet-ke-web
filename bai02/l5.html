<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ĐIỀN FORM MUA NHÀ ONLINE "GIÁ RẺ" !</title>
</head>
<body>
    <h3>ĐIỀN FORM (ƯU ĐÃI CHỈ CÓ TRONG HÔM NAY!)</h3>
    <form>  <!--Chỉ những input, select nào nằm trong <form> thì mới được gửi đi-->
        <label>Tên tài khoản</label>
        <input type="text">
        <br>
        <label>Mật khẩu</label>
        <input type="password">
        <br>
        <label>Họ và tên</label>
        <input type="text">
        <br>
        <label>Giới tính</label>
            <select>
                <option>Male</option>
                <option>Female</option>
            </select>
        <br>
        <label>Ngày sinh</label>
        <input type="date">
        <br>
        <label>Email</label>
        <input type="email">
        <br>
        <label>CCCD</label>
        <input type="number">
        <br>
        <label>Địa chỉ</label>
        <input type="text">
        <br>
        <label>Mua theo diện</label>
            <select>
                <option>Cá nhân</option>
                <option>Doanh nghiệp</option>
            </select>
        <br>
        <label>Nhập số dư của bạn</label>
        <input type="number">
        <br>
        <label>Số lượng nhà cần mua</label>
        <input type="number">
        <br>
        <button type="submit">MUA NGAY !</button>
    </form>
</body>
</html>

<!--HTTP: gửi thẳng dữ liệu trong <form> đến HOST-->
<!--HTTPS: "mã hoá" dữ liệu trong <form> rồi mới gửi đến HOST, sau đó HOST nhận diện rồi mới mở ra-->
